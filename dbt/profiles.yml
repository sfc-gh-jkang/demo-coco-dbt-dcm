# profiles.yml for native dbt on Snowflake.
#
# database/warehouse use ${TARGET_DB} / ${TARGET_WH} placeholders — substituted
# by scripts/deploy.sh via envsubst at PUT time. Snowflake reads the substituted
# version from the stage, so .env is the single source of truth.

pawcore:
  target: prod
  outputs:
    prod:
      type: snowflake
      account: placeholder    # ignored — session context is used
      user: placeholder
      role: ACCOUNTADMIN
      database: ${TARGET_DB}
      warehouse: ${TARGET_WH}
      schema: DBT_PROD
      authenticator: oauth
      threads: 4
