version: 2

models:
  - name: mart_lot_quality_correlation
    description: >
      Manufacturing QA × field performance correlation, aggregated by lot.
      Matches the agent's verified query `manufacturing_field_performance_correlation`.
    columns:
      - name: lot_number
        tests: [not_null, unique]
      - name: pass_rate
      - name: failure_count
      - name: avg_battery_level
      - name: low_battery_incidents

  - name: mart_regional_customer_impact
    description: >
      Customer satisfaction aggregated by lot × region with device telemetry context.
      Matches the agent's verified query `customer_impact_analysis`.
    columns:
      - name: lot_number
        tests: [not_null]
      - name: region
        tests: [not_null]
      - name: avg_rating
      - name: review_count
      - name: avg_battery_level

  - name: mart_battery_moisture_correlation
    description: >
      Battery performance vs humidity, segmented by lot × region with moisture
      resistance test values. Matches the agent's verified query
      `moisture_battery_correlation`.
    columns:
      - name: lot_number
        tests: [not_null]
      - name: region
        tests: [not_null]
      - name: avg_humidity
      - name: avg_battery
      - name: device_count

  - name: mart_weekly_battery_by_region
    description: >
      Battery performance trended by region, week over week. Average and minimum
      battery level plus active device count per week × region, using
      DATE_TRUNC('week', timestamp) from stg_telemetry.
    columns:
      - name: week_start
        tests: [not_null]
      - name: region
        tests:
          - not_null
          - accepted_values:
              values: ['AMERICAS', 'EMEA', 'APAC']
              quote: true
      - name: avg_battery_level
        tests: [not_null]
      - name: min_battery_level
      - name: device_count

  - name: mart_top10_problematic_devices
    description: >
      Top 10 SmartCollar devices by composite risk score (worst first). Telemetry
      is pre-aggregated to one row per device, then LEFT JOINed to per-device
      review ratings. risk_score = low_battery_reading_count * 3 + (5 - avg_rating).
    columns:
      - name: device_id
        tests: [not_null, unique]
      - name: lot_number
        tests: [not_null]
      - name: region
      - name: avg_battery_level
      - name: low_battery_reading_count
      - name: avg_rating
      - name: risk_score

  - name: mart_device_age_cohort_analysis
    description: >
      Device-age cohort analysis. Per-device charging-cycle averages bucketed into
      age bands, with low-battery rate, temperature, and humidity aggregated per
      bucket. Answers whether older (more charging cycles) devices fail at a higher
      rate. The 500+ bucket is expected to be empty with current data.
    columns:
      - name: charging_cycles_bucket
        tests:
          - not_null
          - accepted_values:
              values: ['0-50', '51-100', '101-200', '201-500', '500+']
              quote: true
      - name: device_count
        tests: [not_null]
      - name: low_battery_rate
        tests: [not_null]
      - name: avg_temperature
        tests: [not_null]
      - name: avg_humidity
        tests: [not_null]
